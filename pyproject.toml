[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musique"
version = "0.1.0"
description = "Turn 'Artist - Title' queries into tagged audio files with consistent loudness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Uniquement des dépendances pur Python : elles s'installent par pip sous Termux
# sans compilateur (vérifié sur Android 13 / Termux 0.118.3).
dependencies = [
    "yt-dlp>=2026.8.19",
    "yt-dlp-ejs>=0.8",          # scripts JS nécessaires à yt-dlp pour YouTube (exécutés par deno)
    "ytmusicapi>=1.10",
    "mutagen>=1.47",
    "requests>=2.31",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
musique = "musique.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
